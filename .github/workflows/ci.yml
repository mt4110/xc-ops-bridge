name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build & Test
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Bootstrap Environment
        run: make bootstrap

      - name: Diagnose Tools
        run: make doctor

      - name: Build
        run: make build

      - name: Test
        run: make test
